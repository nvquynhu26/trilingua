<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilingua Vocabulary App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f3f4f6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #111827; text-align: center; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        label { margin-bottom: 5px; font-weight: 600; color: #374151; font-size: 14px; }
        input, select, textarea { padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; }
        button { background: #10b981; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px;}
        button:hover { background: #059669; }
        .btn-secondary { background: #3b82f6; }
        .btn-secondary:hover { background: #2563eb; }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;}
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 15px;}
        .close-btn { background: transparent; color: red; font-size: 20px; border: none; padding: 0; margin: 0; width: auto;}
        
        .conj-table { width: 100%; border-collapse: collapse; }
        .conj-table td { padding: 8px; border: 1px solid #e5e7eb; }
        .conj-table td:first-child { font-weight: 600; background: #f9fafb; width: 40%; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Trilingua Vocabulary Input</h1>
    <form id="vocabForm" onsubmit="saveVocab(event)">
        <input type="hidden" id="editId" value="">
        
        <div class="form-grid">
            <!-- Basic Words -->
            <div class="form-group"><label>Word (EN)</label><input type="text" id="wordEN" placeholder="English"></div>
            <div class="form-group"><label>Meaning (VI)</label><input type="text" id="meaningVI" placeholder="Tiếng Việt"></div>
            <div class="form-group"><label>Word (ES)</label><input type="text" id="wordES" placeholder="Spanish"></div>
            <div class="form-group"><label>Word (KO)</label><input type="text" id="wordKO" placeholder="Korean"></div>
            
            <!-- Grammar & Word Family (Tách riêng POS) -->
            <div class="form-group"><label>Part of Speech (POS)</label>
                <select id="pos">
                    <option value="">-- Select POS --</option>
                    <option value="Noun">Noun</option>
                    <option value="Verb">Verb</option>
                    <option value="Adjective">Adjective</option>
                    <option value="Adverb">Adverb</option>
                </select>
            </div>
            <div class="form-group"><label>Word Family (EN)</label><input type="text" id="wordFamilyEN"></div>
            <div class="form-group"><label>Word Family (ES)</label><input type="text" id="wordFamilyES"></div>
            <div class="form-group"><label>Word Family (KO)</label><input type="text" id="wordFamilyKO"></div>

            <!-- Categories -->
            <div class="form-group"><label>Topic</label><input type="text" id="topic"></div>
            <div class="form-group"><label>Sub-topic</label><input type="text" id="subTopic"></div>
            <div class="form-group"><label>Book</label><input type="text" id="book"></div>
            <div class="form-group"><label>Unit</label><input type="text" id="unit"></div>

            <!-- Examples -->
            <div class="form-group full-width"><label>Example (EN)</label><textarea id="exEN" rows="2"></textarea></div>
            <div class="form-group full-width"><label>Example (ES)</label><textarea id="exES" rows="2"></textarea></div>
            <div class="form-group full-width"><label>Example (KO)</label><textarea id="exKO" rows="2"></textarea></div>
        </div>

        <button type="button" class="btn-secondary full-width" onclick="openConjModal()">📝 Nhập Bảng Chia Động Từ (ES Conjugations)</button>
        <button type="submit" id="submitBtn" class="full-width" style="margin-top: 20px; width: 100%;">💾 Save Vocabulary</button>
    </form>
</div>

<!-- Modal 18 thì Tiếng Tây Ban Nha -->
<div id="conjModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Spanish Conjugations (18 Tenses)</h2>
            <button class="close-btn" onclick="closeConjModal()">✖</button>
        </div>
        <div id="conjTablesContainer"></div>
        <button onclick="saveConjModal()" style="width: 100%;">Lưu Tạm (Save to Temp)</button>
    </div>
</div>

<script>
// ==========================================
// CẤU HÌNH API - ĐỔI LINK Ở DÒNG DƯỚI ĐÂY
// ==========================================
const GAS_WEB_APP_URL = "YOUR_WEB_APP_URL_HERE";

// Variables
let currentConjData = {};
let currentNotes = { EN: "", ES: "", KO: "" }; // Mock for notes if you need to add later
let currentEnIrregData = {}; // Mock for irregular English verbs if needed

const TENSE_KEYS = [
  "IND_Presente", "IND_Imperfecto", "IND_Preterito", "IND_Futuro", "IND_Condicional",
  "FCC_Preterito_Perfecto", "FCC_Pluscuamperfecto", "FCC_Futuro_Perfecto", "FCC_Condicional_Perfecto",
  "SUB_Presente", "SUB_Imperfecto", "SUB_Futuro",
  "TCS_Preterito_Perfecto", "TCS_Pluscuamperfecto", "TCS_Futuro_Perfecto",
  "IMP_Afirmativo", "IMP_Negativo",
  "IND_Preterito_Anterior"
];

// Khởi tạo HTML cho Modal 18 Thì
function buildConjModalHTML() {
  const container = document.getElementById('conjTablesContainer');
  let html = `<table class="conj-table"><tbody>`;
  TENSE_KEYS.forEach(tense => {
    html += `
      <tr>
        <td>${tense.replace(/_/g, ' ')}</td>
        <td><input type="text" id="conj_${tense}" placeholder="Nhập..." /></td>
      </tr>`;
  });
  html += `</tbody></table>`;
  container.innerHTML = html;
}

// Chạy hàm tạo bảng khi web vừa tải xong
document.addEventListener('DOMContentLoaded', buildConjModalHTML);

// Các hàm điều khiển Modal
function openConjModal() {
    document.getElementById('conjModal').style.display = 'flex';
}
function closeConjModal() {
    document.getElementById('conjModal').style.display = 'none';
}

function saveConjModal() {
  let conjData = {};
  TENSE_KEYS.forEach(tense => {
    let input = document.getElementById('conj_' + tense);
    conjData[tense] = input ? input.value : "";
  });
  currentConjData = conjData;
  closeConjModal();
  alert("✅ Đã lưu tạm 18 thì! Nhấn 'Save Vocabulary' ở ngoài cùng để lưu lên Google Sheets.");
}

// Helper: Format Date
function formatDateYYYYMMDD(date) {
    let d = new Date(date),
        month = '' + (d.getMonth() + 1),
        day = '' + d.getDate(),
        year = d.getFullYear();

    if (month.length < 2) month = '0' + month;
    if (day.length < 2) day = '0' + day;

    return [year, month, day].join('-');
}

// Hàm gửi dữ liệu lên Apps Script
async function saveVocab(e) {
  e.preventDefault();
  
  if (GAS_WEB_APP_URL === "YOUR_WEB_APP_URL_HERE") {
      alert("⚠️ Vui lòng thay thế YOUR_WEB_APP_URL_HERE bằng link Apps Script của bạn trong file HTML!");
      return;
  }

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.innerText = "Saving to Google Sheets...";
  submitBtn.disabled = true;

  const id = document.getElementById('editId').value || new Date().getTime().toString();
  const timestamp = formatDateYYYYMMDD(new Date());

  const wordEN = document.getElementById('wordEN').value || "";
  const wordES = document.getElementById('wordES').value || "";
  const wordKO = document.getElementById('wordKO').value || "";
  const meaningVI = document.getElementById('meaningVI').value || "";
  
  const pos = document.getElementById('pos').value || "";
  const wfEN = document.getElementById('wordFamilyEN').value || "";
  const wfES = document.getElementById('wordFamilyES').value || "";
  const wfKO = document.getElementById('wordFamilyKO').value || "";

  const topic = document.getElementById('topic').value || "";
  const subTopic = document.getElementById('subTopic').value || "";
  const book = document.getElementById('book').value || "";
  const unit = document.getElementById('unit').value || "";

  const exEN = document.getElementById('exEN').value || "";
  const exES = document.getElementById('exES').value || "";
  const exKO = document.getElementById('exKO').value || "";

  const noteEN = currentNotes.EN || "";
  const noteES = currentNotes.ES || "";
  const noteKO = currentNotes.KO || "";
  
  const conjJSON = JSON.stringify(currentConjData || {});
  const irregJSON = JSON.stringify(currentEnIrregData || {});

  // Mảng 22 cột User_Vocab
  const vocabRow = [
    id, timestamp, topic, subTopic, 
    wordEN, wordES, wordKO, meaningVI, 
    wfEN, pos, exEN, exES, exKO, 
    book, unit, wfES, wfKO, 
    noteEN, noteES, noteKO, 
    conjJSON, irregJSON
  ];

  try {
    // 1. Post dữ liệu vào User_Vocab
    await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: document.getElementById('editId').value ? 'update' : 'add',
        type: 'vocab',
        id: id,
        row: vocabRow
      })
    });

    // 2. Post dữ liệu vào Spanish_Conjugations (Nếu có điền form 18 thì)
    if (wordES !== "" && Object.keys(currentConjData).length > 0) {
      let conjRow = [
        id, timestamp, wordES, wordEN,
        currentConjData["IND_Presente"] || "", currentConjData["IND_Imperfecto"] || "", 
        currentConjData["IND_Preterito"] || "", currentConjData["IND_Futuro"] || "", 
        currentConjData["IND_Condicional"] || "",
        currentConjData["FCC_Preterito_Perfecto"] || "", currentConjData["FCC_Pluscuamperfecto"] || "", 
        currentConjData["FCC_Futuro_Perfecto"] || "", currentConjData["FCC_Condicional_Perfecto"] || "",
        currentConjData["SUB_Presente"] || "", currentConjData["SUB_Imperfecto"] || "", 
        currentConjData["SUB_Futuro"] || "",
        currentConjData["TCS_Preterito_Perfecto"] || "", currentConjData["TCS_Pluscuamperfecto"] || "", 
        currentConjData["TCS_Futuro_Perfecto"] || "",
        currentConjData["IMP_Afirmativo"] || "", currentConjData["IMP_Negativo"] || "", 
        currentConjData["IND_Preterito_Anterior"] || "",
        conjJSON
      ];

      await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: document.getElementById('editId').value ? 'update' : 'add',
          type: 'conj',
          id: id,
          row: conjRow
        })
      });
    }

    alert("✅ Đã lưu dữ liệu thành công!");
    document.getElementById('vocabForm').reset();
    currentConjData = {}; 
    
    // Xóa trắng ô trong bảng 18 thì
    TENSE_KEYS.forEach(tense => {
        let input = document.getElementById('conj_' + tense);
        if(input) input.value = '';
    });
    
  } catch (error) {
    alert("❌ Lỗi khi lưu. Bạn đã deploy Apps Script và cấp quyền Web App thành Anyone chưa? \nChi tiết lỗi: " + error);
  } finally {
    submitBtn.innerText = "💾 Save Vocabulary";
    submitBtn.disabled = false;
  }
}
</script>

</body>
</html>
