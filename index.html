<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilingua - English | Español | 한국어</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --primary: #10b981;
            --primary-hover: #059669;
            --danger: #ef4444;
            --edit: #3b82f6;
            --grammar: #8b5cf6;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; max-width: 1500px; margin: 0 auto; width: 100%; border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.6rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
        .nav-tabs { display: flex; gap: 10px; flex-wrap: wrap; }
        .tab-btn { background: var(--surface); border: 1px solid var(--border); padding: 10px 18px; border-radius: var(--radius); cursor: pointer; font-weight: 600; color: var(--text); transition: all 0.2s; }
        .tab-btn:hover { background: var(--surface-hover); }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        main { max-width: 1500px; margin: 0 auto; padding: 0 5%; flex: 1; width: 100%; }
        .tab-content { display: none; margin-top: 24px; }
        .tab-content.active { display: block; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
        
        .grid-row-1 { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 16px; margin-bottom: 16px; }
        .grid-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .grid-row-3 { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 16px; margin-bottom: 16px; }
        .grid-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .grid-examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

        @media (max-width: 900px) {
            .grid-row-1, .grid-row-2, .grid-row-3, .grid-row-4 { grid-template-columns: 1fr; }
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; position: relative; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 0.95rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        textarea { resize: vertical; min-height: 80px; }
        .full-width { grid-column: 1 / -1; }

        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
        .btn-danger { background: var(--danger); }
        .btn-edit { background: var(--edit); }
        .btn-grammar { background: var(--grammar); }
        .btn-fmt { background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
        .btn-fmt:hover { background: var(--grammar); color: white; }
        
        .table-container { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { background: var(--bg); font-weight: 700; color: var(--text-secondary); }
        .tts-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; margin-left: 6px; }
        .tts-btn:hover { transform: scale(1.2); }

        .sub-nav { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .sub-btn { background: var(--bg); border: 1px solid var(--border); padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; color: var(--text); font-weight: 500; transition: all 0.2s; }
        .sub-btn:hover { background: var(--surface-hover); }
        .sub-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 700; }

        /* Grammar Tree Sidebar */
        .grammar-layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
        @media (max-width: 900px) { .grammar-layout { grid-template-columns: 1fr; } }
        .sidebar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; max-height: 850px; overflow-y: auto; }
        
        .tree-lang { margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .tree-lang-header { background: var(--bg); padding: 12px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--grammar); }
        .tree-lang-body { display: none; padding: 8px; background: var(--surface); }
        .tree-lang.open .tree-lang-body { display: block; }
        .tree-lang.open .tree-lang-header::after { content: "▲"; font-size: 0.8rem; }
        .tree-lang-header::after { content: "▼"; font-size: 0.8rem; }

        .tree-cat { margin-bottom: 6px; }
        .tree-cat-header { padding: 8px 10px; font-weight: 600; font-size: 0.88rem; cursor: pointer; background: var(--surface-hover); border-radius: 6px; display: flex; justify-content: space-between; }
        .tree-cat-body { display: none; padding-left: 10px; margin-top: 4px; }
        .tree-cat.open .tree-cat-body { display: block; }

        .post-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; background: var(--bg); margin-bottom: 4px; border: 1px solid transparent; }
        .post-item:hover { border-color: var(--grammar); }
        .post-item.active { background: var(--grammar); color: white; font-weight: 600; }

        .editor-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; background: var(--bg); padding: 8px; border-radius: 8px; border: 1px solid var(--border); }

        .quiz-container { max-width: 600px; margin: 0 auto; text-align: center; }
        .flashcard { background: var(--surface); border: 2px solid var(--border); border-radius: 16px; padding: 40px 20px; min-height: 260px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: var(--shadow); margin-bottom: 20px; }
        .flashcard h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .flashcard p { color: var(--text-secondary); font-size: 1.1rem; }
        .quiz-actions { display: flex; justify-content: center; gap: 16px; margin-top: 16px; }

        footer { text-align: center; padding: 20px; font-size: 0.85rem; color: var(--text-secondary); margin-top: auto; border-top: 1px solid var(--border); }
        #toast { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; padding: 12px 24px; border-radius: 8px; display: none; z-index: 100; font-weight: 600; box-shadow: var(--shadow); }
    </style>
</head>
<body>

    <header>
        <div class="logo">Trilingua.</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('tab1')">1. Vocabulary</button>
            <button class="tab-btn" onclick="switchTab('tab2')">2. Search & Topics</button>
            <button class="tab-btn" onclick="switchTab('tab3')">3. Grammar Blog</button>
            <button class="tab-btn" onclick="switchTab('tab4')">4. Quizlet Review</button>
        </div>
    </header>

    <main>
        <!-- TAB 1: VOCABULARY -->
        <div id="tab1" class="tab-content active">
            <div class="card">
                <h2 style="margin-bottom: 16px;">Add New Vocabulary</h2>
                <form id="vocabForm" onsubmit="saveVocab(event)">
                    <input type="hidden" id="editId" value="">
                    
                    <!-- Row 1 -->
                    <div class="grid-row-1">
                        <div class="form-group">
                            <label>English Word</label>
                            <input type="text" id="wordEN">
                        </div>
                        <div class="form-group">
                            <label>Part of Speech</label>
                            <select id="pos">
                                <option value="">-- Select POS --</option>
                                <option value="noun">noun (n)</option>
                                <option value="verb">verb (v)</option>
                                <option value="adj">adjective (adj)</option>
                                <option value="adv">adverb (adv)</option>
                                <option value="phrasal verb">phrasal verb</option>
                                <option value="idiom">idiom</option>
                                <option value="collocation">collocation</option>
                                <option value="phrase">phrase / expression</option>
                                <option value="prefix/suffix">prefix / suffix</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Word Family (English)</label>
                            <input type="text" id="wordFamilyEN" placeholder="e.g. friend (n), friendly (adj)">
                        </div>
                    </div>

                    <!-- Row 2 -->
                    <div class="grid-row-2">
                        <div class="form-group">
                            <label>Spanish Word (ES)</label>
                            <input type="text" id="wordES">
                        </div>
                        <div class="form-group">
                            <label>Word Family (Spanish)</label>
                            <input type="text" id="wordFamilyES" placeholder="e.g. amigo (n), amigable (adj)">
                        </div>
                    </div>

                    <!-- Row 3 -->
                    <div class="grid-row-3">
                        <div class="form-group">
                            <label>Korean Word (KO)</label>
                            <input type="text" id="wordKO">
                        </div>
                        <div class="form-group">
                            <label>Word Family (Korean)</label>
                            <input type="text" id="wordFamilyKO" placeholder="e.g. 친구 (n), 친근한 (adj)">
                        </div>
                        <div class="form-group">
                            <label>Vietnamese Meaning (VI)</label>
                            <input type="text" id="meaningVI">
                        </div>
                    </div>

                    <!-- Row 4 -->
                    <div class="grid-row-4">
                        <div class="form-group">
                            <label>Main Topic</label>
                            <select id="topic" onchange="updateSubtopics(this.value)">
                                <option value="People, Psychology & Relationship">People, Psychology & Relationship</option>
                                <option value="Daily Life, Home & Leisure">Daily Life, Home & Leisure</option>
                                <option value="Work, Education & Business">Work, Education & Business</option>
                                <option value="World, Environment & Travel">World, Environment & Travel</option>
                                <option value="Technology & Media">Technology & Media</option>
                                <option value="Functional Language & Communication">Functional Language & Communication</option>
                                <option value="Basic Concepts & Semantics">Basic Concepts & Semantics</option>
                                <option value="Word Formation, Grammar & Phrasal Verbs">Word Formation, Grammar & Phrasal Verbs</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Sub-topic</label>
                            <select id="subTopic"></select>
                        </div>
                        <div class="form-group">
                            <label>Book Source</label>
                            <select id="book">
                                <option value="General - Elementary">General - Elementary</option>
                                <option value="General - Pre-Int & Int">General - Pre-Int & Int</option>
                                <option value="General - Upper-Intermediate">General - Upper-Intermediate</option>
                                <option value="General - Advanced" selected>General - Advanced</option>
                                <option value="Business - Elementary">Business - Elementary</option>
                                <option value="Business - Pre-Int & Int">Business - Pre-Int & Int</option>
                                <option value="Business - Intermediate">Business - Intermediate</option>
                                <option value="Business - Advanced">Business - Advanced</option>
                                <option value="Academic Vocabulary in Use">Academic Vocabulary in Use</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Unit</label>
                            <select id="unit"></select>
                        </div>
                    </div>

                    <!-- Examples -->
                    <div class="grid-examples">
                        <div class="form-group full-width">
                            <label>English Example Sentence</label>
                            <textarea id="exEN" rows="2" placeholder="Write an example sentence in English..."></textarea>
                        </div>
                        <div class="form-group full-width">
                            <label>Spanish Example Sentence</label>
                            <textarea id="exES" rows="2" placeholder="Escribe una oración de ejemplo en español..."></textarea>
                        </div>
                        <div class="form-group full-width">
                            <label>Korean Example Sentence</label>
                            <textarea id="exKO" rows="2" placeholder="한국어로 예문을 작성하세요..."></textarea>
                        </div>
                    </div>

                    <div style="margin-top: 20px;">
                        <button type="submit" class="btn" id="submitBtn">Save Vocabulary</button>
                        <button type="button" class="btn" style="background:var(--text-secondary); display:none;" id="cancelEditBtn" onclick="resetForm()">Cancel Edit</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
                    <h3>Vocabulary Log</h3>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label for="logFilter" style="margin:0;">Filter period:</label>
                        <select id="logFilter" onchange="renderLogTable()" style="width: auto; padding: 8px 12px;">
                            <option value="today">Today</option>
                            <option value="1day">Yesterday & Today (2 days)</option>
                            <option value="3days">Last 3 Days</option>
                            <option value="7days">Last 7 Days (1 Week)</option>
                            <option value="all">All Time</option>
                        </select>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>English</th>
                                <th>Spanish</th>
                                <th>Korean</th>
                                <th>Vietnamese</th>
                                <th>Topic / Source</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB 2: SEARCH & TOPICS -->
        <div id="tab2" class="tab-content">
            <div class="card">
                <input type="text" id="searchInput" placeholder="🔍 Type any keyword to filter..." oninput="renderTab2()">
            </div>
            
            <div class="card">
                <h3 style="margin-bottom: 12px;">Filter by Topic</h3>
                <div class="sub-nav" id="topicNav"></div>
                <div class="sub-nav" id="subTopicNav" style="border-top: 1px dashed var(--border); padding-top: 12px;"></div>
                
                <div class="table-container" style="margin-top: 16px;">
                    <table>
                        <thead>
                            <tr>
                                <th>English</th>
                                <th>Spanish</th>
                                <th>Korean</th>
                                <th>Vietnamese</th>
                                <th>POS / Family</th>
                                <th>Examples & Source</th>
                            </tr>
                        </thead>
                        <tbody id="tab2TableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB 3: GRAMMAR BLOG -->
        <div id="tab3" class="tab-content">
            <div class="grammar-layout">
                <div class="sidebar">
                    <button class="btn btn-grammar full-width" style="margin-bottom: 12px; width: 100%;" onclick="resetGrammarForm()">+ Write New Post</button>
                    
                    <div style="margin-bottom: 16px;">
                        <input type="text" id="gramSearchInput" placeholder="🔍 Search title/keyword..." oninput="renderGrammarSidebar()">
                    </div>

                    <div id="grammarTreeContainer"></div>
                </div>

                <div class="card" style="margin-bottom: 0;">
                    <h2 id="grammarHeader" style="margin-bottom: 16px; color: var(--grammar);">Create Grammar Note</h2>
                    <form id="grammarForm" onsubmit="saveGrammar(event)">
                        <input type="hidden" id="grammarId" value="">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                            <div class="form-group">
                                <label>Language</label>
                                <select id="gramLang">
                                    <option value="English">English</option>
                                    <option value="Español">Español</option>
                                    <option value="한국어">한국어</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Grammar Topic / Category</label>
                                <input type="text" id="gramTopic" placeholder="e.g., Tenses, Subjunctive, Particle...">
                            </div>
                        </div>

                        <div class="form-group full-width" style="margin-bottom: 16px;">
                            <label>Post Title</label>
                            <input type="text" id="gramTitle" placeholder="e.g., How to use Present Perfect...">
                        </div>
                        <div class="form-group full-width" style="margin-bottom: 16px;">
                            <label>Keywords</label>
                            <input type="text" id="gramKeywords" placeholder="e.g., experience, since, for...">
                        </div>

                        <div class="form-group full-width">
                            <label>Lesson Content & Usage Notes</label>
                            <div class="editor-toolbar">
                                <button type="button" class="btn-fmt" onclick="insertFormat('<b>', '</b>')"><b>B</b> Bold</button>
                                <button type="button" class="btn-fmt" onclick="insertFormat('<i>', '</i>')"><i>I</i> Light/Italic</button>
                                <button type="button" class="btn-fmt" onclick="insertFormat('<span style=\'font-size: 1.25em; font-weight: bold;\'>', '</span>')">Large</button>
                                <button type="button" class="btn-fmt" onclick="insertFormat('<span style=\'font-size: 0.85em; color: var(--text-secondary);\'>', '</span>')">Small</button>
                                <button type="button" class="btn-fmt" onclick="insertFormat('<h3>', '</h3>')">Heading</button>
                                <button type="button" class="btn-fmt" onclick="insertFormat('• ', '')">• Bullet</button>
                            </div>
                            <textarea id="gramContent" rows="18" style="font-size: 1.05rem; line-height: 1.6;" placeholder="Write detailed notes here..."></textarea>
                        </div>

                        <div style="margin-top: 20px; display: flex; gap: 10px;">
                            <button type="submit" class="btn btn-grammar" id="gramSubmitBtn">Save Grammar Note</button>
                            <button type="button" class="btn btn-danger" id="gramDeleteBtn" style="display: none;" onclick="deleteGrammar()">Delete Note</button>
                            <button type="button" class="btn" style="background:var(--text-secondary); display:none;" id="gramCancelBtn" onclick="resetGrammarForm()">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- TAB 4: QUIZLET REVIEW -->
        <div id="tab4" class="tab-content">
            <div class="card" style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center; justify-content: space-between;">
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <label>Topic:</label>
                    <select id="quizTopic" onchange="startQuiz()" style="width: auto;">
                        <option value="ALL">All Topics</option>
                    </select>
                    <label style="margin-left: 10px;">Mode:</label>
                    <select id="quizMode" onchange="startQuiz()" style="width: auto;">
                        <option value="flashcard">Flashcard Flip</option>
                        <option value="typing">Typing Test</option>
                    </select>
                    <label style="margin-left: 10px;">Prompt Language:</label>
                    <select id="quizPrompt" onchange="startQuiz()" style="width: auto;">
                        <option value="VI">Vietnamese</option>
                        <option value="EN">English</option>
                    </select>
                </div>
                <div>
                    <span id="quizProgress" style="font-weight: bold;">0 / 0</span>
                </div>
            </div>

            <div id="flashcardView" class="quiz-container">
                <div class="flashcard" onclick="flipCard()">
                    <h3 id="fcPrompt">---</h3>
                    <p id="fcHint">Click to flip card</p>
                    <div id="fcAnswer" style="display: none; margin-top: 20px; width: 100%; border-top: 1px solid var(--border); padding-top: 16px;">
                        <p id="fcEN" style="color: var(--text); font-weight: bold; font-size: 1.3rem;"></p>
                        <p id="fcES" style="color: var(--primary);"></p>
                        <p id="fcKO" style="color: var(--edit);"></p>
                        <p id="fcFamily" style="font-size: 0.9rem; margin-top: 8px;"></p>
                    </div>
                </div>
                <div class="quiz-actions">
                    <button class="btn btn-danger" onclick="nextCard(false)">❌ Still Learning</button>
                    <button class="btn" onclick="nextCard(true)">✔ Mastered</button>
                </div>
            </div>

            <div id="typingView" class="quiz-container" style="display: none;">
                <div class="card">
                    <h3 id="typePrompt" style="font-size: 1.8rem; margin-bottom: 16px;">---</h3>
                    <div id="typeInputs" style="display: flex; flex-direction: column; gap: 10px; max-width: 400px; margin: 0 auto;">
                        <input type="text" id="inputEN" placeholder="Type English word...">
                        <input type="text" id="inputES" placeholder="Type Spanish word...">
                        <input type="text" id="inputKO" placeholder="Type Korean word...">
                    </div>
                    <div style="margin-top: 20px;">
                        <button class="btn" onclick="checkTyping()">Check Answer</button>
                    </div>
                    <div id="typeResult" style="margin-top: 16px; font-weight: bold; display: none;"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        © Copyright by nvquynhu
    </footer>

    <div id="toast">Notification</div>

    <script>
        // =========================================================================
        // GAS API CONFIG - DÁN LINK DEPLOY CỦA BẠN VÀO DƯỚI (DẠNG .../exec)
        // =========================================================================
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxzRMiJUDGXOXaNg1mM7tNTYSIgu-k-AbP2z96ExLWQkV5WiV0CVYRUNr37I_6-_lZsjg/exec";

        let userVocabList = [];
        let grammarList = [];
        let currentTopicTab = "ALL";
        let currentSubTopicTab = "ALL";
        
        const TOPIC_STRUCTURE = {
            "People, Psychology & Relationship": ["Appearance & Character", "Family, Relationships & Life Events", "Feelings, Emotions & Attitudes", "Health, Illness & Lifestyle"],
            "Daily Life, Home & Leisure": ["Home, Living & Daily Routines", "Food, Drink & Cooking", "Shopping, Fashion & Personal Finance", "Leisure, Sports & Entertainment"],
            "Work, Education & Business": ["Education & Academic Life", "Jobs, Workplace & Career", "Business, Company & Economy"],
            "World, Environment & Travel": ["World, Geography & Nature", "Weather & Environment", "Travel, Transport & Tourism", "Society, Politics, Crime & Culture"],
            "Technology & Media": ["Technology, Computers & Internet", "Media, Press & News"],
            "Functional Language & Communication": ["Social Interaction & Conversation", "Opinions, Arguments & Feedback", "Style, Register & Written Communication"],
            "Basic Concepts & Semantics": ["Time, Numbers, Size & Space", "Actions, Movement & Senses", "Cause, Effect, Logic & Comparison"],
            "Word Formation, Grammar & Phrasal Verbs": ["Word Formation & Word Building", "Key Verbs, Phrasal Verbs & Collocations", "Grammar in Vocabulary Context"]
        };

        window.onload = () => {
            generateUnits();
            updateSubtopics(document.getElementById('topic').value);
            renderTopicNav();
            populateQuizTopics();
            loadFromLocalStorage();
            fetchDataFromGAS();
        };

        function generateUnits() {
            const unitSelect = document.getElementById('unit');
            unitSelect.innerHTML = "";
            for (let i = 1; i <= 120; i++) {
                unitSelect.innerHTML += `<option value="Unit ${i}">Unit ${i}</option>`;
            }
        }

        function loadFromLocalStorage() {

        function speak(text, langCode) {
            if (!window.speechSynthesis || !text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            let selectedVoice = voices.find(v => v.lang === langCode || v.lang.replace('_', '-') === langCode);
            if (!selectedVoice) {
                const prefix = langCode.split('-')[0];
                selectedVoice = voices.find(v => v.lang.startsWith(prefix));
            }
            if (selectedVoice) {
                utterance.voice = selectedVoice;
                utterance.lang = selectedVoice.lang;
            } else { utterance.lang = langCode; }
            window.speechSynthesis.speak(utterance);
        }
        if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

        function renderLogTable() {
            const filterVal = document.getElementById('logFilter').value;
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = "";

            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];

            const filtered = userVocabList.filter(item => {
                if (filterVal === 'all') return true;
                if (!item.timestamp) return false;
                const itemDate = new Date(item.timestamp);
                const diffTime = Math.abs(now - itemDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (filterVal === 'today') return item.timestamp === todayStr || diffDays <= 1;
                if (filterVal === '1day') return diffDays <= 2;
                if (filterVal === '3days') return diffDays <= 3;
                if (filterVal === '7days') return diffDays <= 7;
                return true;
            }).reverse();

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 20px;">No entries found for the selected period.</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${item.en}</strong> ${item.en ? `<button class="tts-btn" onclick="speak('${item.en}', 'en-US')">🔊</button>` : ''}</td>
                        <td>${item.es} ${item.es ? `<button class="tts-btn" onclick="speak('${item.es}', 'es-ES')">🔊</button>` : ''}</td>
                        <td>${item.ko} ${item.ko ? `<button class="tts-btn" onclick="speak('${item.ko}', 'ko-KR')">🔊</button>` : ''}</td>
                        <td>${item.vi}</td>
                        <td style="font-size:0.8rem; color:var(--text-secondary);">${item.topic}<br><em>${item.book} (${item.unit})</em></td>
                        <td>
                            <button class="btn btn-sm btn-edit" onclick="editVocab('${item.id}')">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteVocab('${item.id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        function insertFormat(startTag, endTag) {
            const textarea = document.getElementById('gramContent');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            const selectedText = text.substring(start, end) || "text";
            const replacement = startTag + selectedText + endTag;
            textarea.value = text.substring(0, start) + replacement + text.substring(end);
            textarea.focus();
            textarea.selectionStart = start + startTag.length;
            textarea.selectionEnd = start + startTag.length + selectedText.length;
        }

        function renderGrammarSidebar() {
            const query = (document.getElementById('gramSearchInput')?.value || "").toLowerCase();
            const container = document.getElementById('grammarTreeContainer');
            container.innerHTML = "";

            const currentEditId = document.getElementById('grammarId').value;
            const languages = ["English", "Español", "한국어"];
            const langFlags = { "English": "🇬🇧", "Español": "🇪🇸", "한국어": "🇰🇷" };

            languages.forEach(lang => {
                const langPosts = grammarList.filter(g => g.lang === lang && (!query || 
                    (g.title && g.title.toLowerCase().includes(query)) ||
                    (g.topic && g.topic.toLowerCase().includes(query)) ||
                    (g.keywords && g.keywords.toLowerCase().includes(query)) ||
                    (g.content && g.content.toLowerCase().includes(query))
                ));

                const langEl = document.createElement('div');
                langEl.className = `tree-lang ${query ? 'open' : ''}`;
                
                const langHeader = document.createElement('div');
                langHeader.className = "tree-lang-header";
                langHeader.innerHTML = `<span>${langFlags[lang]} ${lang}</span> <span>(${langPosts.length})</span>`;
                langHeader.onclick = () => langEl.classList.toggle('open');

                const langBody = document.createElement('div');
                langBody.className = "tree-lang-body";

                const categories = {};
                langPosts.forEach(p => {
                    const cat = p.topic || "General";
                    if (!categories[cat]) categories[cat] = [];
                    categories[cat].push(p);
                });

                Object.keys(categories).forEach(cat => {
                    const catEl = document.createElement('div');
                    catEl.className = `tree-cat ${query ? 'open' : ''}`;

                    const catHeader = document.createElement('div');
                    catHeader.className = "tree-cat-header";
                    catHeader.innerHTML = `<span>📂 ${cat}</span> <span>(${categories[cat].length})</span>`;
                    catHeader.onclick = () => catEl.classList.toggle('open');

                    const catBody = document.createElement('div');
                    catBody.className = "tree-cat-body";

                    categories[cat].forEach(post => {
                        const postEl = document.createElement('div');
                        postEl.className = `post-item ${String(post.id) === String(currentEditId) ? 'active' : ''}`;
                        postEl.innerText = post.title || "Untitled";
                        postEl.onclick = (e) => {
                            e.stopPropagation();
                            loadGrammarPost(post.id);
                        };
                        catBody.appendChild(postEl);
                    });

                    catEl.appendChild(catHeader);
                    catEl.appendChild(catBody);
                    langBody.appendChild(catEl);
                });

                langEl.appendChild(langHeader);
                langEl.appendChild(langBody);
                container.appendChild(langEl);
            });
        }

        function renderQuizCard() {
            const total = quizList.length;
            document.getElementById('quizProgress').innerText = `${total === 0 ? 0 : currentQuizIndex + 1} / ${total}`;
            
            if (total === 0) {
                document.getElementById('fcPrompt').innerText = "No vocabulary found for review!";
                document.getElementById('typePrompt').innerText = "No vocabulary found for review!";
                return;
            }

            const item = quizList[currentQuizIndex];
            const promptLang = document.getElementById('quizPrompt').value;
            const promptText = promptLang === "VI" ? item.vi : item.en;

            document.getElementById('fcPrompt').innerText = promptText || "---";
            document.getElementById('fcHint').style.display = 'block';
            document.getElementById('fcAnswer').style.display = 'none';
            document.getElementById('fcEN').innerText = `🇬🇧 ${item.en || ""}`;
            document.getElementById('fcES').innerText = `🇪🇸 ${item.es || ""}`;
            document.getElementById('fcKO').innerText = `🇰🇷 ${item.ko || ""}`;
            document.getElementById('fcFamily').innerText = `EN Family: ${item.familyEN || "-"} | POS: ${item.pos || "-"}`;

            document.getElementById('typePrompt').innerText = promptText || "---";
            document.getElementById('inputEN').style.display = promptLang === "EN" ? 'none' : 'block';
            document.getElementById('inputEN').value = "";
            document.getElementById('inputES').value = "";
            document.getElementById('inputKO').value = "";
            document.getElementById('typeResult').style.display = 'none';
        }

        function flipCard() {
            const ans = document.getElementById('fcAnswer');
            const hint = document.getElementById('fcHint');
            const isHidden = ans.style.display === 'none';
            ans.style.display = isHidden ? 'block' : 'none';
            hint.style.display = isHidden ? 'none' : 'block';
            if(isHidden) {
                const item = quizList[currentQuizIndex];
                if(item.en) speak(item.en, 'en-US');
            }
        }

        function nextCard(remembered) {
            if (quizList.length === 0) return;
            if (!remembered) {
                quizList.push(quizList[currentQuizIndex]);
            }
            currentQuizIndex++;
            if (currentQuizIndex >= quizList.length) {
                alert("🎉 Congratulations! You have completed the review session!");
                startQuiz();
            } else {
                renderQuizCard();
            }
        }

        function cleanText(str) {
            return (str || "").toLowerCase().replace(/\s+/g, '').trim();
        }

        function checkTyping() {
            if (quizList.length === 0) return;
            const item = quizList[currentQuizIndex];
            const promptLang = document.getElementById('quizPrompt').value;

            const valEN = cleanText(document.getElementById('inputEN').value);
            const valES = cleanText(document.getElementById('inputES').value);
            const valKO = cleanText(document.getElementById('inputKO').value);

            const isENCorrect = promptLang === "EN" || !item.en || valEN === cleanText(item.en);
            const isESCorrect = !item.es || valES === cleanText(item.es);
            const isKOCorrect = !item.ko || valKO === cleanText(item.ko);

            const resEl = document.getElementById('typeResult');
            resEl.style.display = 'block';

            if (isENCorrect && isESCorrect && isKOCorrect) {
                resEl.style.color = "var(--primary)";
                resEl.innerHTML = `🎉 Perfect Match! Moving to next card...`;
                if(item.en) speak(item.en, 'en-US');
                setTimeout(() => { nextCard(true); }, 1500);
            } else {
                resEl.style.color = "var(--danger)";
                resEl.innerHTML = `
                    ❌ Incorrect! The answers are:<br>
                    ${promptLang === "VI" && item.en ? `🇬🇧 <b>${item.en}</b> <button class="tts-btn" onclick="speak('${item.en}', 'en-US')">🔊</button><br>` : ''}
                    ${item.es ? `🇪🇸 <b>${item.es}</b> <button class="tts-btn" onclick="speak('${item.es}', 'es-ES')">🔊</button><br>` : ''}
                    ${item.ko ? `🇰🇷 <b>${item.ko}</b> <button class="tts-btn" onclick="speak('${item.ko}', 'ko-KR')">🔊</button><br>` : ''}
                    <button class="btn btn-sm" style="margin-top:10px;" onclick="nextCard(false)">Continue (Review Later)</button>
                `;
            }
        }
    </script>
</body>
</html>
