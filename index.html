<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- APPLE HOME SCREEN WEB APP META TAGS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Trilingua">
    <link rel="apple-touch-icon" href="Logo1.png">
    <title>Trilingua - EN | ES | KO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --primary: #10b981;
            --primary-hover: #059669;
            --danger: #ef4444;
            --edit: #3b82f6;
            --grammar: #8b5cf6;
            --warning: #f59e0b;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --color-en: #4e90c0; /* Blue */
            --color-es: #10b981; /* Green */
            --color-ko: #d57c91; /* Pink */
            --color-vi: #feeeb5; /* Light Yellow */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; width: 100%; max-width: 100vw; }
        
        #authOverlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .auth-card { background: var(--surface); border: 1px solid var(--border); padding: 32px; border-radius: var(--radius); text-align: center; max-width: 380px; width: 100%; box-shadow: var(--shadow); }
        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 4%; max-width: 1600px; margin: 0 auto; width: 100%; border-bottom: 1px solid var(--border); position: relative; }
        
        .logo-container { display: flex; align-items: center; text-decoration: none; }
        .logo-img { height: 40px; width: auto; object-fit: contain; display: block; }
        
        .nav-tabs { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; }
        .tab-btn { background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; border-radius: var(--radius); cursor: pointer; font-weight: 600; color: var(--text); transition: all 0.2s; font-size: 0.8rem; white-space: nowrap; }
        .tab-btn:hover { background: var(--surface-hover); }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .menu-toggle-btn { display: none; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: var(--radius); font-weight: 700; cursor: pointer; font-size: 0.9rem; }
        .dropdown-menu-mobile { display: none; position: absolute; top: 100%; right: 4%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 1000; width: 220px; padding: 10px; flex-direction: column; gap: 6px; }
        .dropdown-menu-mobile.show { display: flex; }
        .dropdown-menu-mobile .tab-btn { width: 100%; text-align: left; }
        @media (max-width: 1150px) {
            .nav-tabs { display: none; }
            .menu-toggle-btn { display: inline-flex; align-items: center; gap: 6px; }
